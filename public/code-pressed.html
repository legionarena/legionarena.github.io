<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cold Pressed - 2D Fruit Catcher Game</title>

    <!-- GitHub Pages / Web App Meta -->
    <meta name="description" content="A standalone zero-asset 2D fruit catcher game built with HTML5 Canvas and Web Audio API.">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cold Pressed">

    <!-- Open Graph for Link Previews -->
    <meta property="og:title" content="Cold Pressed Game">
    <meta property="og:description" content="Single-file HTML5 arcade fruit catcher game.">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #090d16;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .top-nav {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            color: #94a3b8;
        }
        .top-nav a {
            color: #f97316;
            text-decoration: none;
            font-weight: bold;
        }
        .top-nav a:hover {
            text-decoration: underline;
        }
        #game-frame {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: calc(100vh - 70px);
            max-height: 760px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 3px solid #334155;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(56, 189, 248, 0.1);
            overflow: hidden;
            padding: 12px;
        }
        #canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.6);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .score-box, .miss-box, .level-box {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .status-banner {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            z-index: 10;
        }
        .status-banner.slow {
            background: rgba(234, 179, 8, 0.9);
            color: #000;
            opacity: 1;
        }
        .status-banner.frozen {
            background: rgba(56, 189, 248, 0.9);
            color: #000;
            opacity: 1;
        }
        .status-banner.levelup {
            background: rgba(34, 197, 94, 0.95);
            color: #fff;
            opacity: 1;
        }
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .overlay-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay-screen h1 {
            color: #38bdf8;
            margin: 0 0 10px 0;
            font-size: 30px;
        }
        .overlay-screen h1.danger {
            color: #ef4444;
        }
        .overlay-screen p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #cbd5e1;
            text-align: center;
            line-height: 1.5;
        }
        .action-btn {
            background: #f97316;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        }
    </style>
</head>
<body>

<div class="top-nav">
    <span>Cold Pressed &bull; Arcade Catcher</span>
    <a href="/">&larr; Return to Hub</a>
</div>

<div id="game-frame">
    <div id="canvas-wrapper">
        <div class="ui-panel">
            <div class="score-box">Pressed: <span id="score">0</span></div>
            <div class="level-box">Lvl: <span id="level">1</span></div>
            <div class="miss-box">Spoiled: <span id="misses">0</span>/5</div>
        </div>

        <div id="status-banner" class="status-banner">STATUS</div>

        <!-- Start Screen (Required for Audio Context Autoplay unlock) -->
        <div id="start-screen" class="overlay-screen active">
            <h1>COLD PRESSED</h1>
            <p>Catch falling fruit in the jar.<br>Avoid rotten apples & ice cubes!</p>
            <button id="start-btn" class="action-btn">Start Pressing</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay-screen">
            <h1 class="danger">BATCH SPOILED!</h1>
            <p>You caught <span id="final-score">0</span> fruits!<br>Reached Level <span id="final-level">1</span></p>
            <button id="restart-btn" class="action-btn">Press Next Batch</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>
</div>

<script>
    class SoundSynth {
        constructor() {
            this.ctx = null;
        }
        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === "suspended") {
                this.ctx.resume();
            }
        }
        playCatch() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(440, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
        playSlow() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(220, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        }
        playFreeze() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "square";
            osc.frequency.setValueAtTime(600, this.ctx.currentTime);
            osc.frequency.setValueAtTime(300, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.25);
        }
        playLevelUp() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);
            osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.35);
        }
    }

    const sound = new SoundSynth();

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const wrapper = document.getElementById("canvas-wrapper");
    
    const scoreEl = document.getElementById("score");
    const levelEl = document.getElementById("level");
    const missesEl = document.getElementById("misses");
    const startScreen = document.getElementById("start-screen");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreEl = document.getElementById("final-score");
    const finalLevelEl = document.getElementById("final-level");
    const startBtn = document.getElementById("start-btn");
    const restartBtn = document.getElementById("restart-btn");
    const statusBanner = document.getElementById("status-banner");

    function resizeCanvas() {
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
        if (jar) {
            jar.y = canvas.height - 60;
        }
    }

    let score = 0;
    let misses = 0;
    let currentLevel = 1;
    const maxMisses = 5;
    let isGameOver = false;
    let isGameStarted = false;
    let frameCount = 0;
    let bannerTimeout = null;

    const FRUIT_TYPES = [
        { name: "Apple", emoji: "🍎", radius: 24, baseSpeedMin: 1.8, baseSpeedMax: 3.2, points: 1, hazard: null },
        { name: "Orange", emoji: "🍊", radius: 22, baseSpeedMin: 2.0, baseSpeedMax: 3.6, points: 1, hazard: null },
        { name: "Lemon", emoji: "🍋", radius: 20, baseSpeedMin: 2.2, baseSpeedMax: 4.2, points: 2, hazard: null },
        { name: "Watermelon", emoji: "🍉", radius: 34, baseSpeedMin: 1.5, baseSpeedMax: 2.8, points: 1, hazard: null },
        { name: "Grapes", emoji: "🍇", radius: 18, baseSpeedMin: 2.6, baseSpeedMax: 4.8, points: 3, hazard: null },
        { name: "Strawberry", emoji: "🍓", radius: 16, baseSpeedMin: 2.8, baseSpeedMax: 5.2, points: 3, hazard: null },
        { name: "Rotten Apple", emoji: "🤢", radius: 22, baseSpeedMin: 2.0, baseSpeedMax: 4.0, points: 1, hazard: "slow" },
        { name: "Ice Cube", emoji: "🧊", radius: 20, baseSpeedMin: 2.2, baseSpeedMax: 4.2, points: 1, hazard: "freeze" }
    ];

    let fruits = [];

    const jar = {
        x: 0,
        y: 0,
        targetX: 0,
        width: 78,
        height: 80,
        baseSpeed: 0.35,
        slowUntil: 0,
        freezeUntil: 0
    };

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    
    jar.x = canvas.width / 2;
    jar.targetX = canvas.width / 2;
    jar.y = canvas.height - 60;

    function updateTargetX(clientX) {
        if (!isGameStarted) return;
        sound.init();
        const rect = canvas.getBoundingClientRect();
        jar.targetX = clientX - rect.left;
    }

    canvas.addEventListener("touchmove", (e) => {
        if (e.touches.length > 0) updateTargetX(e.touches[0].clientX);
        e.preventDefault();
    }, { passive: false });

    canvas.addEventListener("touchstart", (e) => {
        if (e.touches.length > 0) updateTargetX(e.touches[0].clientX);
    }, { passive: true });

    canvas.addEventListener("mousemove", (e) => updateTargetX(e.clientX));

    const keys = {};
    window.addEventListener("keydown", (e) => { 
        if (isGameStarted) sound.init(); 
        keys[e.code] = true; 
    });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    function showLevelUpBanner(level) {
        statusBanner.textContent = `LEVEL ${level}! SPEED UP ⚡`;
        statusBanner.className = "status-banner levelup";
        if (bannerTimeout) clearTimeout(bannerTimeout);
        bannerTimeout = setTimeout(() => {
            if (Date.now() >= jar.slowUntil && Date.now() >= jar.freezeUntil) {
                statusBanner.className = "status-banner";
            }
        }, 1800);
    }

    function spawnFruit() {
        const type = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
        const margin = type.radius + 15;
        const x = margin + Math.random() * (canvas.width - margin * 2);
        
        const speedBoost = (currentLevel - 1) * 0.75;
        const fallSpeed = type.baseSpeedMin + speedBoost + Math.random() * (type.baseSpeedMax - type.baseSpeedMin);
        
        fruits.push({
            x: x,
            y: -type.radius * 2,
            radius: type.radius,
            speed: fallSpeed,
            emoji: type.emoji,
            points: type.points,
            hazard: type.hazard,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.08
        });
    }

    function drawJar() {
        ctx.save();
        ctx.translate(jar.x, jar.y);

        const now = Date.now();
        const isFrozen = now < jar.freezeUntil;
        const isSlowed = now < jar.slowUntil;

        ctx.fillStyle = isFrozen ? "rgba(56, 189, 248, 0.8)" : "rgba(255, 255, 255, 0.4)";
        ctx.fillRect(-jar.width / 2 - 4, -jar.height / 2 - 8, jar.width + 8, 10);

        ctx.fillStyle = isFrozen ? "rgba(186, 230, 253, 0.35)" : "rgba(255, 255, 255, 0.18)";
        ctx.strokeStyle = isFrozen ? "#38bdf8" : (isSlowed ? "#eab308" : "rgba(255, 255, 255, 0.85)");
        ctx.lineWidth = 3.5;

        ctx.beginPath();
        const w = jar.width;
        const h = jar.height;
        ctx.roundRect(-w / 2, -h / 2, w, h, [8, 8, 18, 18]);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.fillRect(-w / 2 + 8, -h / 2 + 10, 6, h - 25);

        ctx.restore();
    }

    function update() {
        if (isGameOver || !isGameStarted) return;

        frameCount++;
        const now = Date.now();

        let currentResponsiveness = jar.baseSpeed;
        const isFrozen = now < jar.freezeUntil;
        const isSlowed = now < jar.slowUntil;

        if (isFrozen) {
            currentResponsiveness = 0;
            statusBanner.textContent = "FROZEN! 🧊";
            statusBanner.className = "status-banner frozen";
        } else if (isSlowed) {
            currentResponsiveness = jar.baseSpeed * 0.3;
            statusBanner.textContent = "SLOWED! 🤢";
            statusBanner.className = "status-banner slow";
        } else if (!statusBanner.classList.contains("levelup")) {
            statusBanner.className = "status-banner";
        }

        if (!isFrozen) {
            if (keys["ArrowLeft"] || keys["KeyA"]) jar.targetX -= 12;
            if (keys["ArrowRight"] || keys["KeyD"]) jar.targetX += 12;
        }

        jar.x += (jar.targetX - jar.x) * currentResponsiveness;

        const halfW = jar.width / 2;
        if (jar.x - halfW < 0) {
            jar.x = halfW;
            jar.targetX = halfW;
        }
        if (jar.x + halfW > canvas.width) {
            jar.x = canvas.width - halfW;
            jar.targetX = canvas.width - halfW;
        }

        const spawnInterval = Math.max(16, 65 - (currentLevel * 6));
        if (frameCount % spawnInterval === 0) {
            spawnFruit();
        }

        for (let i = fruits.length - 1; i >= 0; i--) {
            let f = fruits[i];
            f.y += f.speed;
            f.rotation += f.rotSpeed;

            const jarTop = jar.y - jar.height / 2;
            const jarBottom = jar.y;
            const jarLeft = jar.x - jar.width / 2;
            const jarRight = jar.x + jar.width / 2;

            if (f.y + f.radius >= jarTop && f.y - f.radius <= jarBottom) {
                if (f.x >= jarLeft && f.x <= jarRight) {
                    score += f.points;
                    scoreEl.textContent = score;

                    const calculatedLevel = Math.floor(score / 25) + 1;
                    if (calculatedLevel > currentLevel) {
                        currentLevel = calculatedLevel;
                        levelEl.textContent = currentLevel;
                        sound.playLevelUp();
                        showLevelUpBanner(currentLevel);
                    } else {
                        sound.playCatch();
                    }

                    fruits.splice(i, 1);
                    continue;
                }
            }

            if (f.y - f.radius > canvas.height) {
                if (f.hazard === "slow") {
                    jar.slowUntil = Date.now() + 4000;
                    sound.playSlow();
                } else if (f.hazard === "freeze") {
                    jar.freezeUntil = Date.now() + 2000;
                    sound.playFreeze();
                }

                misses++;
                missesEl.textContent = misses;
                fruits.splice(i, 1);

                if (misses >= maxMisses) {
                    triggerGameOver();
                }
            }
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        fruits.forEach(f => {
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.rotate(f.rotation);
            ctx.font = `${f.radius * 2}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(f.emoji, 0, 0);
            ctx.restore();
        });

        drawJar();
    }

    function gameLoop() {
        update();
        render();
        if (!isGameOver && isGameStarted) {
            requestAnimationFrame(gameLoop);
        }
    }

    function triggerGameOver() {
        isGameOver = true;
        finalScoreEl.textContent = score;
        finalLevelEl.textContent = currentLevel;
        gameOverScreen.classList.add('active');
    }

    function startGame() {
        sound.init();
        isGameStarted = true;
        startScreen.classList.remove('active');
        requestAnimationFrame(gameLoop);
    }

    function resetGame() {
        score = 0;
        misses = 0;
        currentLevel = 1;
        fruits = [];
        isGameOver = false;
        frameCount = 0;
        jar.slowUntil = 0;
        jar.freezeUntil = 0;
        scoreEl.textContent = '0';
        levelEl.textContent = '1';
        missesEl.textContent = '0';
        gameOverScreen.classList.remove('active');
        requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', resetGame);
</script>
</body>
</html>
